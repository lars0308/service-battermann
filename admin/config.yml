backend:
  name: git-gateway
  branch: main

media_folder: "images/vorher-nachher"
public_folder: "/images/vorher-nachher"

collections:
  - name: "vorher_nachher"
    label: "Vorher / Nachher – Projekte"
    file: "content/vorher-nachher.json"
    fields:
      - label: "Projekte"
        name: "projekte"
        widget: "list"
        summary: "{{titel}}"
        fields:
          - { label: "Titel", name: "titel", widget: "string" }
          - { label: "Kurzbeschreibung", name: "beschreibung", widget: "text", required: false }
          - { label: "Bild vorher", name: "vorher_bild", widget: "image" }
          - { label: "Alt-Text vorher", name: "vorher_alt", widget: "string", required: false }
          - { label: "Bild nachher", name: "nachher_bild", widget: "image" }
          - { label: "Alt-Text nachher", name: "nachher_alt", widget: "string", required: false }
